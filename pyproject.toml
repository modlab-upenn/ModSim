[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "modsim-robotics"
dynamic = ["version"]
description = "A backend-agnostic framework for modular and multi-robot simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "rich>=13,<15",
  "ruamel.yaml>=0.18,<0.20",
  "typer>=0.12,<1",
]
keywords = ["modular-robotics", "mujoco", "robotics", "simulation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
mujoco = [
  "mujoco>=3.2,<4",
  "numpy>=1.26,<3",
]
studio = [
  "numpy>=1.26,<3",
  "pyqtgraph>=0.13,<1",
  "PySide6>=6.7,<7",
  "pyvista>=0.45,<1",
  "pyvistaqt>=0.11,<1",
]
dev = [
  "pre-commit>=4,<5",
  "pyright>=1.1.390,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
modsim = "modsim.cli:app"
modsim-studio = "modsim_studio.launcher:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/modsim", "src/modsim_studio", "src/modsim_backend_mujoco"]

[tool.hatch.version]
path = "src/modsim/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
exclude = [
  "src/modsim_studio/app.py",
  "src/modsim_studio/appearance.py",
  "src/modsim_studio/chrome.py",
  "src/modsim_studio/icons.py",
  "src/modsim_studio/main_window.py",
  "src/modsim_studio/runtime_app.py",
  "src/modsim_studio/runtime_events.py",
  "src/modsim_studio/runtime_graph.py",
  "src/modsim_studio/runtime_lattice.py",
  "src/modsim_studio/runtime_process.py",
  "src/modsim_studio/runtime_planning.py",
  "src/modsim_studio/runtime_window.py",
  "src/modsim_studio/runtime_worker.py",
  "src/modsim_studio/viewport.py",
  "tests/test_runtime_process.py",
  "tests/test_runtime_planning_widgets.py",
  "tests/test_runtime_widgets.py",
  "tests/test_studio_appearance.py",
  "tests/test_studio_viewport.py",
  "tests/test_runtime_worker.py",
  # MuJoCo ships no type stubs, so strict mode reports every engine call as
  # partially unknown. Checked separately by pyright-mujoco.json, which runs at
  # standard strictness where the optional dependency is installed.
  "src/modsim_backend_mujoco",
  "tests/test_mujoco_backend.py",
  "tests/test_mujoco_contact_mechanics.py",
  "tests/test_mujoco_docking.py",
  "tests/test_mujoco_hinges.py",
  "tests/test_mujoco_physical_docking.py",
  "tests/test_mujoco_physical_reconfiguration.py",
  "tests/test_mujoco_runtime_inspector_process.py",
  "tests/test_mujoco_viewer.py",
  "tests/test_mujoco_welds.py",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--basetemp=.test-tmp",
  "--cov=modsim",
  "--cov-branch",
  "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
  "mujoco: requires the optional MuJoCo backend dependencies",
]

[tool.coverage.run]
branch = true
source = ["modsim"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
