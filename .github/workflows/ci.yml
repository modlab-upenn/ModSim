name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync pyright

      - name: Test
        run: uv run --no-sync pytest

  mujoco:
    name: Headless MuJoCo backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked MuJoCo environment
        run: uv sync --locked --extra dev --extra mujoco --python "3.12"

      - name: Type check MuJoCo backend
        run: uv run --no-sync pyright --project pyright-mujoco.json

      - name: Test MuJoCo backend and cross-backend conformance
        run: >-
          uv run --no-sync pytest
          tests/test_mblocks_example_pack.py
          tests/test_mblocks_physical_twelve.py
          tests/test_momentum_pivot.py
          tests/test_mujoco_backend.py
          tests/test_mujoco_docking.py
          tests/test_mujoco_hinges.py
          tests/test_mujoco_physical_docking.py
          tests/test_mujoco_physical_reconfiguration.py
          tests/test_mujoco_reconfiguration.py
          tests/test_mujoco_runtime_inspector_process.py
          tests/test_smores_example_pack.py
          tests/test_mujoco_viewer.py
          tests/test_mujoco_welds.py
          tests/test_backend_conformance.py

  studio:
    name: Native Studio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Studio environment
        run: uv sync --locked --extra dev --extra studio --python "3.12"

      - name: Type check Studio
        run: uv run --no-sync pyright --project pyright-studio.json

      - name: Test Studio appearance and Runtime Inspector
        run: >-
          xvfb-run -a uv run --no-sync pytest
          tests/test_runtime_process.py
          tests/test_runtime_widgets.py
          tests/test_runtime_worker.py
          tests/test_studio_appearance.py

      - name: Launch Studio smoke test
        run: |
          xvfb-run -a uv run --no-sync python - <<'PY'
          from pathlib import Path
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication
          from modsim_studio.appearance import THEMES, theme_manager
          from modsim_studio.main_window import MainWindow
          from modsim_studio.session_logging import (
              configure_session_logging,
              resolve_session_log_path,
              shutdown_session_logging,
          )

          app = QApplication([])
          pack_path = Path("examples/robot_packs/generic_cube")
          log_path = resolve_session_log_path(pack_path)
          logger = configure_session_logging(pack_path)
          window = MainWindow(
              initial_path=pack_path,
              session_logger=logger,
              session_log_path=log_path,
          )
          window.show()

          def finish() -> None:
              assert window.project is not None
              assert window.project.pack.id == "generic_cube"
              module = next(iter(window.project.pack.hardware_catalog.module_types.values()))
              assert window._select_tree_entity(("module", module.id, module.id))
              module_item = window.project_tree.currentItem()
              assert module_item.isExpanded()
              camera = tuple(tuple(vector) for vector in window.viewport.plotter.camera_position)
              actors = tuple(
                  actor for links in window.viewport._link_actors.values() for actor in links
              )
              materials = tuple(actor.prop.color for actor in actors)
              for identifier in THEMES:
                  theme_manager().set_theme(identifier, persist=False)
                  app.processEvents()
                  assert tuple(tuple(v) for v in window.viewport.plotter.camera_position) == camera
                  assert tuple(actor.prop.color for actor in actors) == materials
                  assert window.project is not None and not window.project.dirty
              assert "Opened Robot Pack 'generic_cube'" in window.log.toPlainText()
              assert log_path.is_file()
              window.project = None
              window.close()
              shutdown_session_logging()
              app.quit()

          QTimer.singleShot(500, finish)
          QTimer.singleShot(15000, lambda: app.exit(1))
          raise SystemExit(app.exec())
          PY

  package:
    name: Build and smoke-test distributions
    needs:
      - checks
      - mujoco
      - studio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl modsim --help

      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz modsim --help
