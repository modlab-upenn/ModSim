schema_version: '0.1'
id: smores_ep
name: SMORES-EP
version: 0.1.0
description: >-
  SMORES-EP V4.2.0 Fusion 360 export with four provisional EP-face connector
  semantics and lightweight MuJoCo collision proxies for docking development.
metadata:
  asset_source: SMORES-EP V4.2.0 Fusion 360 export
  repository_inclusion: authorized_for_collaborator_access
  semantic_status: provisional_demo
model_views:
  - id: smores_topology
    name: SMORES Topology
    builder: module_topology_graph
    modes:
      - runtime
    default: true
    configuration: {}
assets:
  urdf:
    smores_ep: assets/urdf/smores_ep.urdf
  mesh_directories:
    meshes: assets/meshes
    collision_meshes: assets/collision_meshes
  mujoco: {}
  isaac_usd: {}
  thumbnails: {}
specs:
  modules: specs/module_types.yaml
  connectors: specs/connector_types.yaml
  capabilities: specs/capabilities.yaml
mappings:
  urdf: mappings/urdf_mapping.yaml
