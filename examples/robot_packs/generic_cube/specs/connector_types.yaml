schema_version: "0.1"

connector_types:
  fixed_face:
    name: Fixed Face Connector
    active: true
    gender: hermaphroditic
    compatible_with:
      - fixed_face
    allowed_orientations:
      mode: discrete
      values_rad:
        - 0.0
        - 1.5707963267948966
        - 3.141592653589793
        - 4.71238898038469
    acceptance_region:
      shape: box
      position_tolerance_m: 0.006
      orientation_tolerance_rad: 0.13962634015954636
      max_relative_velocity_m_s: 0.05
    physical_connection:
      constraint: fixed
      compliance: null
    limits:
      max_normal_force_n: 90.0
      max_shear_force_n: 40.0
      max_bending_moment_nm: 1.8
    supports_undocking: true
